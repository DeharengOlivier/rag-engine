[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-engine"
version = "0.1.0"
description = "A small, well-architected, offline-first Retrieval-Augmented Generation engine over your own documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Olivier Dehareng" }]
keywords = ["rag", "retrieval", "embeddings", "llm", "search"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# numpy is the only hard dependency. Everything else is optional and lazily imported.
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
embeddings = ["sentence-transformers"]
llm = ["anthropic", "openai"]
pii = ["presidio-analyzer", "presidio-anonymizer", "spacy"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pip-audit", "bandit"]

[project.scripts]
rag = "rag_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: ship the type information with the package so it is checked, not
# guessed, in the projects that depend on it.
[tool.setuptools.package-data]
rag_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning that nobody reads is a warning that hides a real one.
filterwarnings = ["error"]

[tool.ruff]
line-length = 90
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import order
    "B",    # bugbear: the mistakes that become defects
    "UP",   # pyupgrade
    "SIM",  # obvious simplifications
    "RUF",  # ruff's own checks
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private attributes on purpose to exercise guards that a
# validated configuration makes unreachable.
"tests/*" = ["SLF001"]

[tool.mypy]
# No python_version pin: it forces mypy to read the installed numpy stubs with
# an older grammar than they are written in. The supported floor is enforced by
# running the test suite across the version matrix in CI instead.
files = ["src"]
strict = true
# The optional providers are imported lazily and are not installed in CI.
[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "presidio_analyzer.*", "presidio_anonymizer.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/rag_engine"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    # Protocol method bodies are declarations, not code paths.
    "^\\s*\\.\\.\\.$",
]
